<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">RustPlusHelper fake development map</title>
  <desc id="desc">A stylized procedural island used only for UI development.</desc>
  <defs>
    <radialGradient id="ocean" cx="48%" cy="46%" r="70%">
      <stop offset="0" stop-color="#24423f" />
      <stop offset="1" stop-color="#122825" />
    </radialGradient>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#718067" />
      <stop offset="0.55" stop-color="#536450" />
      <stop offset="1" stop-color="#384a3f" />
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c5ccc1" />
      <stop offset="1" stop-color="#85958b" />
    </linearGradient>
    <pattern id="minorGrid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#d8e1d6" stroke-opacity="0.06" stroke-width="1" />
    </pattern>
    <pattern id="majorGrid" width="250" height="250" patternUnits="userSpaceOnUse">
      <rect width="250" height="250" fill="url(#minorGrid)" />
      <path d="M 250 0 L 0 0 0 250" fill="none" stroke="#e6eee4" stroke-opacity="0.13" stroke-width="2" />
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#08100e" flood-opacity="0.65" />
    </filter>
  </defs>

  <rect width="1000" height="1000" fill="url(#ocean)" />

  <g filter="url(#shadow)">
    <path fill="url(#land)" stroke="#93a686" stroke-opacity="0.48" stroke-width="5"
          d="M148 389 C151 271 247 161 369 130 C491 99 604 126 685 184 C772 247 873 340 869 464 C866 576 800 698 710 780 C626 857 489 892 369 848 C252 805 154 715 122 596 C102 520 117 445 148 389 Z" />

    <path fill="#b89555" opacity="0.62"
          d="M127 517 C151 594 195 661 261 717 C310 758 366 783 425 799 C375 718 361 635 388 551 C336 505 262 484 190 489 C165 491 143 500 127 517 Z" />

    <path fill="url(#snow)" opacity="0.72"
          d="M487 132 C578 124 664 156 725 207 C760 237 792 273 817 316 C745 339 681 376 629 427 C585 386 532 359 471 345 C494 272 501 199 487 132 Z" />

    <path fill="none" stroke="#273c35" stroke-opacity="0.9" stroke-width="13" stroke-linecap="round"
          d="M224 680 C314 618 375 567 446 510 C530 442 610 385 732 326" />
    <path fill="none" stroke="#a4a48b" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"
          d="M224 680 C314 618 375 567 446 510 C530 442 610 385 732 326" />

    <path fill="none" stroke="#273c35" stroke-opacity="0.8" stroke-width="10" stroke-linecap="round"
          d="M321 231 C379 328 412 408 446 510 C502 580 580 646 687 719" />
    <path fill="none" stroke="#a4a48b" stroke-opacity="0.48" stroke-width="4" stroke-linecap="round"
          d="M321 231 C379 328 412 408 446 510 C502 580 580 646 687 719" />

    <path fill="none" stroke="#29544e" stroke-width="10" stroke-linecap="round" opacity="0.8"
          d="M615 246 C604 316 574 360 526 410 C498 441 486 473 490 515 C495 565 474 606 425 645 C397 667 378 701 375 746" />

    <g fill="#283c32" opacity="0.55">
      <circle cx="267" cy="321" r="58" />
      <circle cx="311" cy="362" r="44" />
      <circle cx="692" cy="547" r="69" />
      <circle cx="633" cy="626" r="48" />
      <circle cx="520" cy="740" r="60" />
      <circle cx="753" cy="435" r="45" />
    </g>

    <g fill="#202a25" stroke="#a6b79c" stroke-opacity="0.45" stroke-width="3">
      <rect x="213" y="591" width="78" height="63" rx="6" />
      <rect x="665" y="258" width="96" height="80" rx="6" />
      <rect x="694" y="637" width="66" height="66" rx="6" />
      <circle cx="386" cy="399" r="42" />
    </g>
  </g>

  <rect x="0" y="0" width="1000" height="1000" fill="url(#majorGrid)" />

  <g fill="#edf2e8" fill-opacity="0.24" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">
    <text x="18" y="32">A</text><text x="268" y="32">B</text><text x="518" y="32">C</text><text x="768" y="32">D</text>
    <text x="18" y="282">2</text><text x="18" y="532">3</text><text x="18" y="782">4</text>
  </g>

  <g transform="translate(500 940)" text-anchor="middle" font-family="Segoe UI, sans-serif">
    <text y="0" fill="#eef1eb" fill-opacity="0.5" font-size="20" font-weight="800" letter-spacing="5">DEMO MAP</text>
    <text y="24" fill="#eef1eb" fill-opacity="0.28" font-size="10" font-weight="700" letter-spacing="2">NOT LIVE RUST SERVER DATA</text>
  </g>
</svg>
